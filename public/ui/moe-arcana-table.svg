<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Original anime fantasy card table background">
  <defs>
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff7ff"/>
      <stop offset="0.34" stop-color="#ffd9ec"/>
      <stop offset="0.68" stop-color="#cdefff"/>
      <stop offset="1" stop-color="#9a78d8"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9c8"/>
      <stop offset="0.34" stop-color="#ff9cc4"/>
      <stop offset="0.68" stop-color="#7bdcf5"/>
      <stop offset="1" stop-color="#8ff0c4"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f4aa8"/>
      <stop offset="0.45" stop-color="#db76aa"/>
      <stop offset="1" stop-color="#3aa7c4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#62335a" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="92" height="92" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="2" fill="#ffffff" opacity="0.8"/>
      <path d="M55 18l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#fff3a8" opacity="0.75"/>
      <circle cx="75" cy="66" r="1.8" fill="#8ee8bd" opacity="0.65"/>
      <path d="M24 70l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#ffd9ec" opacity="0.72"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#3e315d"/>
